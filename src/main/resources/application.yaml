server:
  port: 8085

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: charge-fee-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        # max.block.ms must be at least as long as delivery.timeout.ms, and
        # the publisher waits longer than both. Otherwise a publish can be
        # reported as failed while the message is still on its way, and the
        # retry sends it a second time.
        max.block.ms: 15000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      observation-enabled: true
      
  application:
    name: charge-fee-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  messaging:
    producer-name: charge-fee-service
  fee:
    other-account:
      # fee = flat-fee + (amount x percentage / 100), rounded to 2 decimals (half up)
      flat-fee: ${FEE_OTHER_FLAT:10.00}
      # percentage is 0 to 100. 1.5 means 1.5 percent.
      percentage: ${FEE_OTHER_PERCENTAGE:0.00}
      # upper limit for the fee. 0 means no limit.
      max-fee: ${FEE_OTHER_MAX:0.00}
  observability:
    log-bodies: true
    max-body-length: 2048

management:
  server:
    port: 18085
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.calls: true
        kafka.consume: true
        client.calls: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
  file:
    name: ${BANKING_LOG_DIR:${user.home}/banking-logs}/${spring.application.name}.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB